<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چوونەژوورەوە - بپەڕەوە بۆ ڕیکلامەکان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-radius: 24px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); text-align: center; }
        .logo-icon { width: 60px; height: 60px; background: #007aff; border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: white; font-size: 28px; }
        h1 { font-size: 26px; color: #1d1d1f; margin-bottom: 8px; font-weight: 700; }
        p.subtitle { color: #86868b; font-size: 14px; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; text-align: right; }
        .input-group label { display: block; font-size: 14px; color: #1d1d1f; margin-bottom: 8px; font-weight: 600; }
        .input-group input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid #e5e5ea; background: #f2f2f7; font-size: 15px; outline: none; direction: ltr; }
        .submit-btn { width: 100%; padding: 14px; border-radius: 14px; border: none; background: #0066cc; color: white; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .submit-btn:hover { background: #0051a8; }
        .footer-text { margin-top: 25px; font-size: 14px; color: #86868b; }
        .footer-text a { color: #007aff; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-icon"></div>
        <h1>چوونەژوورەوە</h1>
        <p class="subtitle">بەخێربێیت، تکایە بچۆ ژوورەوە بۆ بەڕێوەبردنی ڕێکلامەکانت</p>

        <form id="login-form">
            <div class="input-group">
                <label>ئیمەیڵ</label>
                <input type="email" id="email" value="based@gmail.com" required placeholder="ئیمەیڵەکەت بنووسە">
            </div>

            <div class="input-group">
                <label>وشەی تێپەڕ (Password)</label>
                <input type="password" id="password" value="12345678" required placeholder="••••••••">
            </div>

            <button type="submit" id="btn-submit" class="submit-btn">بچۆ ژوورەوە</button>
        </form>

        <div class="footer-text">
            ئەکاونتت نییە؟ <a href="#">تۆمار ببه</a>
        </div>
    </div>

    <!-- 🚀 تاقیکردنەوەی ڕاستەوخۆ -->
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault(); 
            // هەوڵدان بۆ ڕۆشتن بۆ index.html
            window.location.href = './index.html'; 
        });
    </script>

</body>
</html>
